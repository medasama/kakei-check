<script>
/* =========================================================
   設定：Supabase（medasama-tools）の接続情報を入れてください。
   空のままだと「この端末だけに保存」で動きます。
   ========================================================= */
const SUPABASE_URL = "https://edfrjxjdzxutcjeayfac.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GVtanlT_gDwSEQSsZPC_NQ_nEK-60x2";
const TABLE = "cashflow_store";

const LS_PASS = "cf_pass";
const LS_CACHE = "cf_cache";
const LS_VIEW = "cf_view";

/* ---------- 初期データ ---------- */
// closing: 締め日（0 = 末日） / withdraw: 引落日（締めた月の翌月の何日）
// marketClosing: 楽天市場での買い物だけの締め日（「いつ払い？」と一覧の注記にだけ使う）
const DEFAULT_CARDS = [
  { id:"rakuten",        name:"楽天カード",   closing:0,  withdraw:27, marketClosing:25 },
  { id:"saison",         name:"セディナ",     closing:0,  withdraw:27 },
  { id:"ones",           name:"ワンズ",       closing:0,  withdraw:26 },
  { id:"paypay",         name:"PayPayカード", closing:0,  withdraw:27 },
  { id:"epos",           name:"エポス",       closing:4,  withdraw:4 },
  { id:"stacia",         name:"スタシア",     closing:15, withdraw:10 },
  { id:"jwest",          name:"J-WEST",       closing:15, withdraw:10 },
  { id:"recruit",        name:"リクルート",   closing:15, withdraw:10 },
];
const DEFAULT_FUNDS = [
  { id:"smbc",   name:"三井住友" },
  { id:"rbank",  name:"楽天銀行" },
  { id:"jibun",  name:"じぶん銀行" },
  { id:"cash",   name:"現金" },
  { id:"stock",  name:"株売却" },
];
const emptyAmt = () => ({ amt:0, end:null, carried:false });
function freshState(){
  return {
    v:2,
    cards: DEFAULT_CARDS.map(c=>({ ...c, conf:emptyAmt(), open:emptyAmt() })),
    funds: DEFAULT_FUNDS.map(f=>({ ...f, amount:0, openAmount:0 })),
    kakei: defaultKakei(),
    incomes: [],       // 確定分タブの入金予定（複数）
    openIncomes: [],   // 途中経過タブの入金予定（仮・複数）
    updatedAt: null,
  };
}

/* ---------- 日付計算 ---------- */
const DAY = 86400000;
function ymd(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function lastDayOf(y,m){ return new Date(y, m+1, 0).getDate(); }
function closingDate(y,m,c){ const L=lastDayOf(y,m); return new Date(y,m,(c===0||c>L)?L:c); }
function daysBetween(a,b){ return Math.round((ymd(b)-ymd(a))/DAY); }
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

// 利用中：今日を含む締め期間
function openCycle(today, c){
  const y=today.getFullYear(), m=today.getMonth();
  const cd = closingDate(y,m,c);
  let end, prevEnd;
  if (ymd(today) <= cd){ end = cd; prevEnd = closingDate(y,m-1,c); }
  else { end = closingDate(y,m+1,c); prevEnd = cd; }
  const start = new Date(prevEnd.getFullYear(), prevEnd.getMonth(), prevEnd.getDate()+1);
  return { start, end };
}
// 確定：直近で締まった締め期間
function closedCycle(today, c){
  const y=today.getFullYear(), m=today.getMonth();
  let end = closingDate(y,m,c);
  if (!(end < ymd(today))) end = closingDate(y,m-1,c);
  const prevEnd = closingDate(end.getFullYear(), end.getMonth()-1, c);
  const start = new Date(prevEnd.getFullYear(), prevEnd.getMonth(), prevEnd.getDate()+1);
  return { start, end };
}
function withdrawDate(closeEnd, w){
  const y=closeEnd.getFullYear(), m=closeEnd.getMonth()+1;
  return new Date(y, m, Math.min(w, lastDayOf(y,m)));
}
function schedules(card, today){
  const cc = closedCycle(today, card.closing);
  const oc = openCycle(today, card.closing);
  const conf = { ...cc, withdraw: withdrawDate(cc.end, card.withdraw) };
  conf.paid = ymd(conf.withdraw) < ymd(today);           // 引落日を過ぎた
  const open = { ...oc, withdraw: withdrawDate(oc.end, card.withdraw) };
  open.total = daysBetween(oc.start, oc.end) + 1;
  open.elapsed = Math.min(open.total, Math.max(1, daysBetween(oc.start, today) + 1));
  open.predicted = card.open.amt || 0;   // 引落目安額＝入力した利用額そのもの
  return { conf, open };
}

// 締めをまたいだら「利用中」の金額を「確定分」へ自動で繰り越す
function rollOver(today){
  let changed = false;
  state.cards.forEach(c=>{
    const ccEnd = keyOf(closedCycle(today, c.closing).end);
    const ocEnd = keyOf(openCycle(today, c.closing).end);
    if (c.open.end && c.open.end !== ocEnd){
      if (c.open.end === ccEnd && c.open.amt && !(c.conf.end === ccEnd && c.conf.amt)){
        c.conf = { amt:c.open.amt, end:ccEnd, carried:true };
      }
      c.open = { amt:0, end:ocEnd, carried:false }; changed = true;
    }
    if (c.conf.end && c.conf.end !== ccEnd){ c.conf = { amt:0, end:ccEnd, carried:false }; changed = true; }
    if (!c.open.end){ c.open.end = ocEnd; }
    if (!c.conf.end){ c.conf.end = ccEnd; }
  });
  return changed;
}

/* ---------- 表示ヘルパ ---------- */
const yen = n => (n<0?"−":"") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
const closingLabel = c => c===0 ? "末日" : `${c}日`;
const esc = s => String(s).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const shortName = n => n.replace(/カード/,"");
function parseYen(s){ const n = parseInt(String(s).replace(/[^\d-]/g,""),10); return isNaN(n)?0:n; }
const fmtInput = n => n ? (+n).toLocaleString("ja-JP") : "";

/* ---------- 暗号化（合言葉 → AES-GCM） ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function sha256Hex(s){
  const h = await crypto.subtle.digest("SHA-256", enc.encode(s));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptJSON(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
  return JSON.stringify({ v:1, s:b64(salt), iv:b64(iv), ct:b64(ct) });
}
async function decryptJSON(payload, pass){
  const p = JSON.parse(payload);
  const key = await deriveKey(pass, unb64(p.s));
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(p.iv)}, key, unb64(p.ct));
  return JSON.parse(dec.decode(pt));
}

/* ---------- 保存 ---------- */
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let PASS = null, ROW_ID = null, state = null, saveTimer = null, syncMsg = "", syncErr = false;
let VIEW = "conf";

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

async function loadWith(pass){
  ROW_ID = await sha256Hex("cashflow-tool:" + pass);
  let payload = null;
  if (sb){
    const { data, error } = await sb.from(TABLE).select("payload,updated_at").eq("id", ROW_ID).maybeSingle();
    if (error) throw new Error("同期サーバーに接続できませんでした：" + error.message);
    if (data) payload = data.payload;
  }
  if (!payload){
    const cache = lsGet(LS_CACHE);
    if (cache){ try{ const c = JSON.parse(cache); if (c.id === ROW_ID) payload = c.payload; }catch(e){} }
  }
  if (!payload) return freshState();
  let raw;
  try { raw = await decryptJSON(payload, pass); }
  catch(e){ throw new Error("合言葉が違うか、データを読めませんでした。"); }
  return migrate(raw);
}
function migrate(s){
  const base = freshState();
  if (!s || !Array.isArray(s.cards)) return base;
  if (!s.v || s.v < 2){
    // v1：1枠の金額＋確定フラグ → 確定分／利用中の2枠へ
    s.cards = s.cards.map(c=>{
      const n = { ...c, conf:emptyAmt(), open:emptyAmt() };
      if (c.confirmed) n.conf.amt = c.amount||0; else n.open.amt = c.amount||0;
      if (c.id === "ones" && c.withdraw === 27) n.withdraw = 26;
      delete n.amount; delete n.confirmed;
      return n;
    });
    s.v = 2;
  }
  s.funds = Array.isArray(s.funds) ? s.funds : base.funds;
  // 途中経過用の（仮）残高・入金予定。旧版の「入金予定」1欄は入金予定の行へ移す
  s.funds.forEach(f=>{ f.openAmount = +f.openAmount || 0; });
  if (+s.nextIncome){
    const inc = s.funds.find(f=>f.id==="income") || s.funds[s.funds.length-1];
    if (inc) inc.openAmount += +s.nextIncome;
  }
  delete s.nextIncome;
  // 入金予定：残高の項目から切り出して、複数件のリストに
  s.incomes = Array.isArray(s.incomes) ? s.incomes : [];
  s.openIncomes = Array.isArray(s.openIncomes) ? s.openIncomes : [];
  const incIdx = s.funds.findIndex(f=>f.id==="income");
  if (incIdx >= 0){
    const f = s.funds[incIdx];
    if (+f.amount) s.incomes.push({ id:"i"+Date.now(), name:"入金予定", amount:+f.amount });
    if (+f.openAmount) s.openIncomes.push({ id:"o"+Date.now(), name:"入金予定", amount:+f.openAmount });
    s.funds.splice(incIdx, 1);
  }
  // 楽天：「楽天市場分」と「市場以外」の2行 → 1行にまとめる（金額は合算）
  const ich = s.cards.findIndex(c=>c.id==="rakuten-ichiba");
  const rk = s.cards.find(c=>c.id==="rakuten");
  if (ich >= 0){
    const a = s.cards[ich];
    if (rk){
      rk.conf.amt = (+rk.conf.amt||0) + (+a.conf.amt||0);
      rk.open.amt = (+rk.open.amt||0) + (+a.open.amt||0);
    }
    s.cards.splice(ich, 1);
  }
  if (rk){
    if (rk.name === "楽天カード（市場以外）") rk.name = "楽天カード";
    if (rk.marketClosing === undefined) rk.marketClosing = 25;
  }
  s.cards.forEach(c=>{ delete c.marketOnly; });
  if (!s.kakei || !Array.isArray(s.kakei.cats)) s.kakei = defaultKakei();
  upgradeKakei(s.kakei);
  return s;
}
function scheduleSave(){
  clearTimeout(saveTimer);
  setSync("保存待ち…", false);
  saveTimer = setTimeout(saveNow, 900);
}
async function saveNow(){
  state.updatedAt = new Date().toISOString();
  try{
    const payload = await encryptJSON(state, PASS);
    lsSet(LS_CACHE, JSON.stringify({ id: ROW_ID, payload }));
    if (sb){
      const { error } = await sb.from(TABLE).upsert({ id: ROW_ID, payload, updated_at: state.updatedAt });
      if (error) throw error;
      setSync("同期済み " + timeStr(new Date()), false);
    } else {
      setSync("この端末に保存 " + timeStr(new Date()), false);
    }
  }catch(e){
    setSync("同期失敗（端末には保存済み）", true);
    console.error(e);
  }
}
const timeStr = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
function setSync(msg, err){
  syncMsg = msg; syncErr = err;
  const el = document.getElementById("sync");
  if (el){ el.textContent = msg; el.className = "sync" + (err?" err":""); }
}

/* ---------- 計算 ---------- */
function buildTimeline(start, items){
  const groups = new Map();
  items.forEach(it=>{
    const k = ymd(it.date).getTime();
    if (!groups.has(k)) groups.set(k, { date:it.date, names:[], sum:0 });
    const g = groups.get(k); g.names.push(it.name); g.sum += it.amount;
  });
  let bal = start;
  return [...groups.values()].sort((a,b)=>a.date-b.date).map(g=>{ bal -= g.sum; return { ...g, balance:bal }; });
}
function compute(){
  const today = new Date();
  const sumInc = list => list.reduce((a,x)=>a+(+x.amount||0),0);
  const fundsTotal = state.funds.reduce((a,f)=>a+(+f.amount||0),0) + sumInc(state.incomes);
  const rows = state.cards.map(c=>({ card:c, sch: schedules(c, today) }));

  // 確定分（未引落のもの）
  const confItems = rows.filter(r=>!r.sch.conf.paid && r.card.conf.amt)
    .map(r=>({ date:r.sch.conf.withdraw, name:shortName(r.card.name), amount:r.card.conf.amt }));
  const confTotal = confItems.reduce((a,i)=>a+i.amount,0);
  const confTimeline = buildTimeline(fundsTotal, confItems);
  const afterConf = fundsTotal - confTotal;

  // 途中経過（利用中）：確定分とは別に入れた（仮）の残高・入金予定からスタート
  const openStart = state.funds.reduce((a,f)=>a+(+f.openAmount||0),0) + sumInc(state.openIncomes);
  const openItems = rows.filter(r=>r.sch.open.predicted)
    .map(r=>({ date:r.sch.open.withdraw, name:shortName(r.card.name), amount:r.sch.open.predicted }));
  const openCurrent = state.cards.reduce((a,c)=>a+(+c.open.amt||0),0);
  const openPredicted = openItems.reduce((a,i)=>a+i.amount,0);
  const openTimeline = buildTimeline(openStart, openItems);

  return { today, fundsTotal, rows, confTotal, confTimeline, afterConf,
           openStart, openCurrent, openPredicted, openTimeline,
           openOutlook: openStart - openPredicted };
}

function renderLock(errMsg=""){
  document.getElementById("app").innerHTML = `
  <div class="lock">
    <section>
      <h2>家計チェック</h2>
      <p style="margin:0 0 12px;font-size:14px">合言葉を入力してください。初めての場合は、ここで決めた合言葉でデータが作られます。</p>
      <input type="password" id="pass" autocomplete="current-password" placeholder="合言葉">
      <label><input type="checkbox" id="remember" checked> この端末に合言葉を記憶する</label>
      <button class="btn" id="open" style="width:100%">開く</button>
      <div class="err-msg" id="err">${esc(errMsg)}</div>
      <p class="hint">合言葉は暗号化の鍵です。忘れるとデータを復元できません。${sb ? "" : "<br>※ 同期設定が未入力のため、この端末だけに保存されます。"}</p>
    </section>
  </div>`;
  const go = async ()=>{
    const p = document.getElementById("pass").value;
    if (!p){ document.getElementById("err").textContent = "合言葉を入力してください。"; return; }
    document.getElementById("err").textContent = "読み込み中…";
    try{
      state = await loadWith(p); PASS = p;
      if (document.getElementById("remember").checked) lsSet(LS_PASS, p); else lsDel(LS_PASS);
      afterLoad();
    }catch(e){ document.getElementById("err").textContent = e.message; }
  };
  document.getElementById("open").onclick = go;
  document.getElementById("pass").onkeydown = e=>{ if (e.key==="Enter") go(); };
  document.getElementById("pass").focus();
}
function afterLoad(){
  setSync(sb ? "同期済み" : "この端末に保存", false);
  if (rollOver(new Date())) scheduleSave();
  render();
}

// 「いつ払い？」：購入日ごとの引落日
let SIM_DATE = null, SIM_AMT = 0;
function parseDateInput(v){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||""); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function purchaseInfo(card, pd){
  const cyc = openCycle(pd, card.closing);                 // 購入日を含む締め期間
  const wd = withdrawDate(cyc.end, card.withdraw);
  const nextStart = new Date(cyc.end.getFullYear(), cyc.end.getMonth(), cyc.end.getDate()+1);
  const nextWd = withdrawDate(openCycle(nextStart, card.closing).end, card.withdraw);
  return { closeEnd:cyc.end, withdraw:wd, days:daysBetween(pd, wd),
           nextStart, nextWd, wait:daysBetween(pd, nextStart) };
}
function simHTML(r){
  const pd = SIM_DATE || ymd(r.today);
  const list = state.cards.map(c=>({ card:c, ...purchaseInfo(c, pd) }))
    .sort((a,b)=> b.withdraw-a.withdraw);
  const best = list[0];
  return `
    <section>
      <h2>このカードでいつ買うと、いつの引落？</h2>
      <div class="sim-in">
        <div><label for="sim-date">購入日</label><input type="date" id="sim-date" value="${keyOf(pd)}"></div>
        <div><label for="sim-amt">金額（任意）</label><input type="text" inputmode="numeric" id="sim-amt" value="${fmtInput(SIM_AMT)}" placeholder="0"></div>
      </div>
      ${best ? `<div class="hint">${md(pd)}に買うなら、引落がいちばん遅いのは <b>${esc(best.card.name)}</b>（${md(best.withdraw)}・${best.days}日後）です。</div>` : ""}
    </section>
    <section>
      <h2>カード別（引落が遅い順）</h2>
      ${list.map(x=>{
        const inCurrent = keyOf(x.closeEnd) === keyOf(openCycle(r.today, x.card.closing).end);
        let out = "";
        if (SIM_AMT){
          out = inCurrent
            ? `<div class="sim-out num">買った後の見込み収支（途中経過）：<b class="${r.openOutlook-SIM_AMT<0?"neg":""}">${yen(r.openOutlook - SIM_AMT)}</b></div>`
            : `<div class="sim-out sub sim-sub">今集計している期間より後の引落です（途中経過には含まれません）</div>`;
        }
        return `
        <div class="sim-card">
          <div class="sim-head"><div class="n">${esc(x.card.name)}</div><div class="w num">${md(x.withdraw)}引落</div></div>
          <div class="sim-sub num">${md(pd)}購入 → ${md(x.closeEnd)}締め → ${md(x.withdraw)}引落（${x.days}日後）</div>
          <div class="sim-tip num">あと${x.wait}日待って <b>${md(x.nextStart)}</b> 以降に買えば → <b>${md(x.nextWd)}引落</b>（${daysBetween(x.withdraw, x.nextWd)}日先送り）</div>
          ${x.card.marketClosing ? (()=>{ const m = purchaseInfo({ closing:x.card.marketClosing, withdraw:x.card.withdraw }, pd);
            return `<div class="sim-sub num" style="margin-top:6px"><b>楽天市場で買う場合（${x.card.marketClosing}日締め）</b>：${md(m.closeEnd)}締め → ${md(m.withdraw)}引落（${m.days}日後）</div>
            <div class="sim-tip num">あと${m.wait}日待って <b>${md(m.nextStart)}</b> 以降に買えば → <b>${md(m.nextWd)}引落</b>（${daysBetween(m.withdraw, m.nextWd)}日先送り）</div>`; })() : ""}
          ${out}
        </div>`;}).join("")}
      <div class="hint">締め日の翌日に買うと、引落はまるまる1か月先になります。楽天カードは、楽天市場で買う場合の締め日（25日）も併せて表示しています。</div>
    </section>`;
}

    </section>
  </div>`;

  openDetails.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });
  window.scrollTo(0, scrollY);
  bind();
}

/* ---------- 月ごとのデータ保存 ---------- */
const MONTHS = {};   // ym → { data, id, timer, loading }
const freshMonth = () => ({ v:1, mf:[], pts:[], ov:{}, incomes:[], updatedAt:null });
async function monthId(ym){ return sha256Hex("cashflow-tool:" + PASS + ":kakei:" + ym); }
async function loadMonth(ym, force=false){
  if (MONTHS[ym] && MONTHS[ym].data && !force) return MONTHS[ym].data;
  const id = await monthId(ym);
  let payload = null;
  if (sb){
    const { data, error } = await sb.from(TABLE).select("payload").eq("id", id).maybeSingle();
    if (error) throw new Error("同期サーバーに接続できませんでした：" + error.message);
    if (data) payload = data.payload;

  }
  MONTHS[ym] = { ...(MONTHS[ym]||{}), data, id };
  return data;
}
function saveMonthSoon(ym){
  const m = MONTHS[ym]; if (!m) return;
  clearTimeout(m.timer);
  setSync("保存待ち…", false);

async function saveMonthNow(ym){

/* ---------- CSV（マネーフォワード） ---------- */
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i=0; i<text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === ","){ row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r"){
      if (ch === "\r" && text[i+1] === "\n") i++;
      row.push(f); f = ""; if (row.some(x=>x!=="")) rows.push(row); row = [];
    } else f += ch;
  }
  if (f !== "" || row.length){ row.push(f); if (row.some(x=>x!=="")) rows.push(row); }
  return rows;
}
function decodeCSV(buf){
  let t = new TextDecoder("shift_jis").decode(buf);
  if (!t.includes("計算対象")){
    t = new TextDecoder("utf-8").decode(buf).replace(/^﻿/, "");
  }
  return t;
}
async function importMF(file){
  const text = decodeCSV(await file.arrayBuffer());
  const rows = parseCSV(text);
  if (!rows.length) throw new Error("CSVが空です。");
  const H = rows[0].map(h=>h.trim());
  const col = name => H.indexOf(name);
  const need = ["計算対象","日付","内容","金額（円）","保有金融機関","大項目","中項目","振替","ID"];
  const miss = need.filter(n=>col(n)<0);
  if (miss.length) throw new Error("マネーフォワードの入出金CSVではないようです（見つからない列：" + miss.join("、") + "）");
  const recs = rows.slice(1).map(r=>{
    const dm = /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec((r[col("日付")]||"").trim());
    if (!dm) return null;
    return {
      id: r[col("ID")], d: `${dm[1]}-${dm[2].padStart(2,"0")}-${dm[3].padStart(2,"0")}`,
      t: r[col("内容")] || "", amt: parseInt(String(r[col("金額（円）")]).replace(/[^\d-]/g,""),10) || 0,
      src: r[col("保有金融機関")] || "", l: r[col("大項目")] || "", m: r[col("中項目")] || "",
      calc: r[col("計算対象")] === "1" ? 1 : 0, tr: r[col("振替")] === "1" ? 1 : 0,
    };
  }).filter(Boolean);
  if (!recs.length) throw new Error("取り込める明細がありませんでした。");
  const minD = recs.reduce((a,r)=>r.d<a?r.d:a, recs[0].d);
  const maxD = recs.reduce((a,r)=>r.d>a?r.d:a, recs[0].d);
  // CSVの期間に含まれる月を、その期間の分だけ入れ替える（手動の振り分けはIDで残る）
  const months = []; for (let ym = ymOf(minD); ym <= ymOf(maxD); ym = ymShift(ym,1)) months.push(ym);
  for (const ym of months){
    const data = await loadMonth(ym);
    data.mf = data.mf.filter(r=>r.d < minD || r.d > maxD).concat(recs.filter(r=>ymOf(r.d)===ym));
    saveMonthSoon(ym);
  }
  return { count: recs.length, minD, maxD, months };
}

/* ---------- 楽天ポイント履歴の貼り付け ---------- */
function parsePoints(text){
  const toks = String(text).normalize("NFKC").split(/[\t\r\n]+/).map(s=>s.trim()).filter(Boolean);
  const isY = t => /^\d{4}$/.test(t), isMD = t => /^\d{1,2}\/\d{1,2}$/.test(t), isYMD = t => /^\d{4}\s+\d{1,2}\/\d{1,2}$/.test(t);
  const startAt = i => (isY(toks[i]) && isMD(toks[i+1]||"")) ? 2 : isYMD(toks[i]) ? 1 : 0;
  const out = []; let skipped = 0, i = 0;
  while (i < toks.length){
    const s = startAt(i);
    if (!s){ i++; continue; }
    i += s;
    const svc = toks[i++] || "";
    const content = []; let d = null;
    while (i < toks.length){
      if (startAt(i)) break;
      const t = toks[i++];
      const mm = t.match(/\[(\d{4})\/(\d{1,2})\/(\d{1,2})\]\s*$/);
      if (mm){
        const pre = t.slice(0, mm.index).trim(); if (pre) content.push(pre);
        d = `${mm[1]}-${mm[2].padStart(2,"0")}-${mm[3].padStart(2,"0")}`; break;
      }
      content.push(t);
    }
    if (!d) continue;
    const st = []; let amt = null;
    while (i < toks.length && !startAt(i)){
      const t = toks[i];
      if (/^[+-]?[\d,]+$/.test(t)){ amt = Math.abs(parseInt(t.replace(/[^\d]/g,""),10)); i++; break; }
      st.push(t); i++;
    }
    if (amt == null) continue;
    const status = st.join(" ");
    if (/獲得|取消|キャンセル/.test(status) || !/利用/.test(status)){ skipped++; continue; }
    out.push({ d, svc, t: content.join(""), st: status, amt });
  }
  // 同じ日・同じ内容・同じ額が複数ある場合も区別できるよう、出現順の番号を付ける
  const seen = {};
  out.forEach(r=>{ const base = [r.d, r.svc, r.t, r.amt].join("|"); seen[base] = (seen[base]||0) + 1; r.key = base + "#" + seen[base]; });
  return { recs: out, skipped };
}
async function importPoints(text){
  const { recs, skipped } = parsePoints(text);
  if (!recs.length) throw new Error("ポイント利用の行を読み取れませんでした。楽天PointClubの「ポイント実績」ページの表を、日付の列から選択してコピーしてください。");
  const byM = {};
  recs.forEach(r=>{ (byM[ymOf(r.d)] = byM[ymOf(r.d)] || []).push(r); });
  let added = 0, dup = 0;
  for (const ym of Object.keys(byM)){
    const data = await loadMonth(ym);
    const keys = new Set(data.pts.map(p=>p.key));
    byM[ym].forEach(r=>{ if (keys.has(r.key)) dup++; else { data.pts.push(r); keys.add(r.key); added++; } });
    saveMonthSoon(ym);
  }
  return { added, dup, skipped, months: Object.keys(byM).sort() };
}

/* ---------- 振り分け ---------- */
const catById = id => state.kakei.cats.find(c=>c.id===id);
const isMarketSrc = r => r.src.startsWith("楽天市場");
const isCardMarket = r => r.src.includes("楽天カード") && /楽天市場|ラクテンイチバ/.test(nk(r.t));
function matchRule(text, kind){
  const s = nk(text);
  return state.kakei.rules.find(r=>r.kw && (r.src==="all" || r.src===kind) && s.includes(nk(r.kw)) && catById(r.cat));
}
function matchMap(r){
  const M = state.kakei.mfMap.filter(x=>catById(x.cat));
  return M.find(x=>x.l && x.m && x.l===r.l && x.m===r.m)
      || M.find(x=>!x.l && x.m && x.m===r.m)
      || M.find(x=>x.l && !x.m && x.l===r.l);
}
function classify(kind, r, text, ov){
  if (ov && catById(ov)) return { cat: ov, how: "manual" };
  const rule = matchRule(text, kind);
  if (rule) return { cat: rule.cat, how: "rule" };
  if (kind === "mf"){ const mp = matchMap(r); if (mp) return { cat: mp.cat, how: "map" }; }
  const fallback = catById("h_other") ? "h_other" : (state.kakei.cats.find(c=>c.group==="house")||state.kakei.cats[0]).id;
  return { cat: fallback, how: "default" };
}
function computeKakei(data){
  data.ok = data.ok || {};
  const txs = [], marketRows = [], coupons = [];
  const shopOf = t => nk(t).split(/\s/)[0];
  data.mf.forEach(r=>{
    const key = "m:" + r.id;
    const mk = isMarketSrc(r), cm = isCardMarket(r);
    if (mk) marketRows.push(r);
    if (r.calc === 0 || r.tr === 1) return;                      // マネーフォワードの設定どおり
    if (r.amt > 0){
      if (mk){ coupons.push(r); return; }                          // 楽天市場のクーポン値引き → 後で同じ店の商品から差し引く
      if (r.l === "収入" || r.l === "未分類" || !r.l) return;      // 収入・ポイント付与などは集計しない
    }
    const c = classify("mf", r, r.t, data.ov[key]);
    txs.push({ key, kind:"mf", d:r.d, t:r.t, spend:-r.amt, cm, mk, raw:r, ...c });
  });
  // クーポン：同じ店（内容の先頭の語）・前後2日の商品と同じカテゴリから差し引く
  coupons.forEach(r=>{
    const key = "m:" + r.id, shop = shopOf(r.t);
    const base = txs.find(t=>t.mk && t.spend > 0 && shopOf(t.t) === shop && Math.abs((new Date(t.d) - new Date(r.d))/DAY) <= 2);
    if (!base && !data.ov[key]) return;
    const c = data.ov[key] && catById(data.ov[key]) ? { cat:data.ov[key], how:"manual" } : { cat:base.cat, how:base.how==="default"?"default":"rule" };
    txs.push({ key, kind:"mf", d:r.d, t:r.t, spend:-r.amt, cm:false, mk:true, coupon:true, raw:r, ...c });
  });
  data.pts.forEach(p=>{
    const key = "p:" + p.key;
    const c = classify("pt", p, p.svc + " " + p.t, data.ov[key]);
    txs.push({ key, kind:"pt", d:p.d, t:(p.svc ? "［" + p.svc + "］" : "") + p.t, spend:p.amt, cm:false, raw:p, ...c });
  });
  txs.sort((a,b)=> b.d.localeCompare(a.d) || b.spend - a.spend);
  const byCat = {};
  state.kakei.cats.forEach(c=> byCat[c.id] = { total:0, pts:0, list:[] });
  txs.forEach(t=>{ const b = byCat[t.cat]; if (!b) return; b.total += t.spend; if (t.kind==="pt") b.pts += t.spend; b.list.push(t); });
  const sumG = g => state.kakei.cats.filter(c=>c.group===g).reduce((a,c)=>a+byCat[c.id].total,0);
  const house = sumG("house"), self = sumG("self");
  const income = (data.incomes||[]).reduce((a,x)=>a+(+x.amount||0),0);
  const counted = t => catById(t.cat) && catById(t.cat).group !== "skip";
  const dups = findDups(txs, counted, data);
  // 対応表にないマネーフォワードの項目
  const um = {};
  txs.filter(t=>t.kind==="mf" && t.how==="default" && !t.coupon && t.raw.l && t.raw.l !== "未分類").forEach(t=>{
    const k = t.raw.l + "|" + t.raw.m; um[k] = um[k] || { l:t.raw.l, m:t.raw.m, n:0, sum:0 }; um[k].n++; um[k].sum += t.spend;
  });
  const unassigned = txs.filter(t=>t.how==="default").length;
  return { txs, byCat, house, self, income, balance: income - house, dups, unmapped: Object.values(um), unassigned, marketRows };
}
// 二重計上の可能性：楽天カード側の楽天市場の行と、楽天市場側の「同じ日・同じ店の注文」の両方が数えられていて、
// 前後3日以内かつ（金額が一致 または 店名が一致）するもの。1つの注文は1つの組にだけ入れる。
const mShopOf = t => nk(t).split(/\s/)[0].replace(/楽天市場店?/g, "");
const cardShopOf = t => (nk(t).replace(/ラクテンイチバ\d*/g, "").replace(/楽天市場店?/g, "").split(/\s/).filter(Boolean)[0] || "");
function findDups(txs, counted, data){
  const orders = {};
  txs.filter(t=>t.mk && counted(t)).forEach(t=>{
    const k = t.d + "|" + mShopOf(t.t);
    const o = orders[k] = orders[k] || { d:t.d, shop:mShopOf(t.t), txs:[], net:0 };
    o.txs.push(t); o.net += t.spend;
  });
  const O = Object.values(orders).filter(o=>o.txs.some(t=>!t.coupon));
  const cands = [];
  txs.filter(t=>t.cm && counted(t) && !data.ok[t.key]).forEach(card=>{
    const cs = cardShopOf(card.t);
    O.forEach(o=>{
      const gap = Math.abs((new Date(o.d) - new Date(card.d))/DAY);
      if (gap > 3) return;
      const amt = o.net === card.spend;
      const name = !!(cs && o.shop && (o.shop.includes(cs) || cs.includes(o.shop)));
      if (amt || name) cands.push({ card, order:o, score:(amt?2:0)+(name?1:0), gap });
    });
  });
  cands.sort((a,b)=> b.score - a.score || a.gap - b.gap);
  const usedCard = new Set(), usedOrder = new Set(), groups = [];
  cands.forEach(c=>{
    if (usedCard.has(c.card.key) || usedOrder.has(c.order)) return;
    usedCard.add(c.card.key); usedOrder.add(c.order);
    groups.push({ card:c.card, order:c.order, amtMatch: c.score >= 2 });
  });
  return groups.sort((a,b)=> b.card.d.localeCompare(a.card.d));
}
function marketHints(t, k){
  if (!t.cm) return [];
  const base = new Date(t.d);
  return k.marketRows.filter(r=> r.amt < 0 && Math.abs((new Date(r.d) - base)/DAY) <= 3).slice(0,4);
}
function ruleKeywordFor(t){
  const raw = String(t.kind==="pt" ? t.raw.t : t.raw.t).normalize("NFKC");
  const cut = raw.split(/\s楽天ペイ|楽天ペイで|\s/)[0];
  return cut.slice(0, 20);
}

function bindKakei(){
  const app = document.getElementById("app");
  const m = MONTHS[KYM]; const data = m && m.data;
  const K = state.kakei;
  const saveS = () => { scheduleSave(); render(); };
  app.querySelectorAll("[data-kym]").forEach(b=>b.onclick=()=>{ KYM = ymShift(KYM, +b.dataset.kym); RULE_DRAFT = null; K_MSG = ""; render(); });
  if (!data) return;

  const f = document.getElementById("mf-file");
  if (f) f.onchange = async ()=>{
    const file = f.files[0]; if (!file) return;
    K_MSG = "取り込み中…"; K_MSG_ERR = false; render();
    try{
      const r = await importMF(file);
      KYM = r.months[r.months.length-1];
      K_MSG = `${r.count}件を取り込みました（${mdS(r.minD)}〜${mdS(r.maxD)}）。`; K_MSG_ERR = false;

      const r = await importPoints(text);

    }catch(e){ PT_MSG = e.message; PT_MSG_ERR = true; }

    const key = s.dataset.txcat;
    if (!s.value){ delete data.ov[key]; RULE_DRAFT = null; }
    else {
      data.ov[key] = s.value;
      const k = computeKakei(data); const t = k.txs.find(x=>x.key===key);
      RULE_DRAFT = t ? { key, kw: ruleKeywordFor(t), cat: s.value, kind: t.kind } : null;

  }));

    const kw = document.getElementById("rule-kw").value.trim();

      K.rules.unshift({ id:"r"+Date.now(), kw: kw.normalize("NFKC"), src: "all", cat: RULE_DRAFT.cat });

    RULE_DRAFT = null; saveS();
  };
  const rc = document.getElementById("rule-close");
  if (rc) rc.onclick = ()=>{ RULE_DRAFT = null; render(); };

  // 入金

  app.querySelectorAll("[data-kiname]").forEach(el=>el.addEventListener("change", ()=>{ data.incomes[+el.dataset.kiname].name = el.value.trim(); saveMonthSoon(KYM); }));
  app.querySelectorAll("[data-kinc]").forEach(el=>{
    el.addEventListener("focus", ()=>{ el.value = el.value.replace(/,/g,""); el.select(); });
    el.addEventListener("change", ()=>{ data.incomes[+el.dataset.kinc].amount = parseYen(el.value); saveMonthSoon(KYM); render(); });
    el.addEventListener("keydown", e=>{ if (e.key==="Enter") el.blur(); });
  });

  // 設定
  app.querySelectorAll("[data-mapadd]").forEach(el=>el.addEventListener("change", ()=>{
    if (!el.value) return;
    const [l, m] = el.dataset.mapadd.split("|");
    K.mfMap.unshift({ l, m, cat: el.value }); saveS();
  }));
  app.querySelectorAll("[data-dupex]").forEach(b=>b.onclick=()=>{ b.dataset.dupex.split(",").forEach(k=>data.ov[k] = "x_skip"); saveMonthSoon(KYM); render(); });
  app.querySelectorAll("[data-dupok]").forEach(b=>b.onclick=()=>{ data.ok = data.ok || {}; data.ok[b.dataset.dupok] = true; saveMonthSoon(KYM); render(); });
  const onK = (sel, fn) => app.querySelectorAll(sel).forEach(el=>el.addEventListener("change", ()=>{ fn(el); saveS(); }));
  onK("[data-kcname]", el=>K.cats[+el.dataset.kcname].name = el.value.trim() || "カテゴリ");
  onK("[data-kcbud]",  el=>K.cats[+el.dataset.kcbud].budget = parseYen(el.value));
  app.querySelectorAll("[data-kcbud]").forEach(el=>el.addEventListener("focus", ()=>{ el.value = el.value.replace(/,/g,""); el.select(); }));
  app.querySelectorAll("[data-kcdel]").forEach(b=>b.onclick=()=>{
    const c = K.cats[+b.dataset.kcdel];
    if (confirm(`カテゴリ「${c.name}」を削除しますか？（振り分けられていた明細は自動の振り分けに戻ります）`)){ K.cats.splice(+b.dataset.kcdel,1); saveS(); }
  });
  app.querySelectorAll("[data-kcadd]").forEach(b=>b.onclick=()=>{
    const g = b.dataset.kcadd;
    K.cats.push({ id: g[0]+"_"+Date.now(), name:"新しいカテゴリ", group: g, ...(g==="house"?{budget:0}:{}) });
    saveS();
  });
  onK("[data-krkw]",  el=>K.rules[+el.dataset.krkw].kw = el.value.trim().normalize("NFKC"));
  onK("[data-krsrc]", el=>K.rules[+el.dataset.krsrc].src = el.value);
  onK("[data-krcat]", el=>K.rules[+el.dataset.krcat].cat = el.value);
  app.querySelectorAll("[data-krdel]").forEach(b=>b.onclick=()=>{ K.rules.splice(+b.dataset.krdel,1); saveS(); });
  const kra = document.getElementById("kr-add");
  if (kra) kra.onclick = ()=>{ K.rules.unshift({ id:"r"+Date.now(), kw:"", src:"all", cat:"h_other" }); saveS(); };
  onK("[data-kml]",   el=>K.mfMap[+el.dataset.kml].l = el.value.trim());
  onK("[data-kmm]",   el=>K.mfMap[+el.dataset.kmm].m = el.value.trim());
  onK("[data-kmcat]", el=>K.mfMap[+el.dataset.kmcat].cat = el.value);
  app.querySelectorAll("[data-kmdel]").forEach(b=>b.onclick=()=>{ K.mfMap.splice(+b.dataset.kmdel,1); saveS(); });
  const kma = document.getElementById("km-add");
  if (kma) kma.onclick = ()=>{ K.mfMap.push({ l:"", m:"", cat:"h_other" }); saveS(); };
}

/* ---------- 起動 ---------- */
VIEW = ["conf","open","sim","kakei","points"].includes(lsGet(LS_VIEW)) ? lsGet(LS_VIEW) : "conf";
(async ()=>{
  const saved = lsGet(LS_PASS);
  if (saved){
    try{ state = await loadWith(saved); PASS = saved; afterLoad(); return; }
    catch(e){ renderLock(e.message); return; }
  }
  renderLock();
})();

// 他の端末で更新された分を、画面に戻ったときに取り込む（日付またぎの繰越もここで行う）
document.addEventListener("visibilitychange", async ()=>{
  if (document.visibilityState !== "visible" || !PASS) return;
  if (document.activeElement && document.activeElement.classList.contains("money")) return;
  try{
    if (sb){
      const fresh = await loadWith(PASS);
      if (fresh.updatedAt && (!state.updatedAt || fresh.updatedAt > state.updatedAt)){
        state = fresh; setSync("最新を取り込みました", false);
      }
    }
    if (rollOver(new Date())) scheduleSave();
    if (isKakeiView() && sb && MONTHS[KYM]) await loadMonth(KYM, true);
    render();
  }catch(e){}
});
</script>
